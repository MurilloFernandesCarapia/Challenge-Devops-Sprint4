name: CI-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - master

pr: none

pool:
  vmImage: ubuntu-24.04

variables:
  buildConfiguration: Release
  solution: src/PetCare360.API.slnx
  apiProject: src/PetCare360.API/PetCare360.API.csproj
  artifactName: petcare360-api

stages:
  - stage: CI
    displayName: CI - Build, testes e artefato
    jobs:
      - job: BuildTestPublish
        displayName: Build, testes automatizados e publicação do artefato
        steps:
          - task: UseDotNet@2
            displayName: Instalar o SDK do .NET 10
            inputs:
              packageType: sdk
              version: 10.x

          - task: DotNetCoreCLI@2
            displayName: Restaurar dependências (NuGet)
            inputs:
              command: restore
              projects: $(solution)

          - task: DotNetCoreCLI@2
            displayName: Compilar a solução
            inputs:
              command: build
              projects: $(solution)
              arguments: --configuration $(buildConfiguration) --no-restore

          - task: DotNetCoreCLI@2
            displayName: Executar testes unitários e de integração
            inputs:
              command: test
              projects: $(solution)
              arguments: --configuration $(buildConfiguration) --no-build --collect "XPlat Code Coverage"
              publishTestResults: true

          - task: PublishCodeCoverageResults@2
            displayName: Publicar a cobertura de código
            inputs:
              summaryFileLocation: $(Agent.TempDirectory)/**/coverage.cobertura.xml

          - task: DotNetCoreCLI@2
            displayName: Gerar o pacote da API (dotnet publish)
            inputs:
              command: publish
              publishWebProjects: false
              projects: $(apiProject)
              arguments: --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)
              zipAfterPublish: true

          - task: PublishPipelineArtifact@1
            displayName: Publicar o artefato no Azure DevOps
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: $(artifactName)
              publishLocation: pipeline